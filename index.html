    function formatBytes(bytes) {
      if (!bytes || bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    function formatDuration(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    // Safe cross-browser clipboard copy helper
    function safeCopyText(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).catch(() => {
          fallbackCopy(text);
        });
      } else {
        fallbackCopy(text);
      }
    }

    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
      } catch (e) {}
      document.body.removeChild(ta);
    }

          const rawTailSample = new TextDecoder('latin1').decode(

      const handleDictFileUpload = async (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        try {
          const text = await file.text();
          const words = text
            .split(/\r?\n/)
            .map((w) => w.trim())
            .filter(Boolean);
          setCustomDictWords(words);
          setCustomDictName(file.name);
          showToast(`Loaded ${words.length.toLocaleString()} passwords from ${file.name}`, 'success');
        } catch (err) {
          showToast('Failed to read dictionary text file', 'error');

      const buildCandidateList = () => {
        if (attackMode === 'direct') {
          return directPassword ? [directPassword] : [];
        }

        if (attackMode === 'dictionary') {
          const merged = [...customDictWords, ...BUILT_IN_DICTIONARY];
          return Array.from(new Set(merged));
        }

        const generateCombinations = (alphabet, minL, maxL, prefix = '', suffix = '') => {
          const results = [];
          const MAX_LIMIT = 20000;

          const helper = (current, targetLen) => {
            if (results.length >= MAX_LIMIT) return;
            if (current.length === targetLen) {
              results.push(prefix + current + suffix);
              return;
            }
            for (let i = 0; i < alphabet.length; i++) {
              helper(current + alphabet[i], targetLen);
              if (results.length >= MAX_LIMIT) return;
            }
          };

          for (let len = minL; len <= maxL; len++) {
            helper('', len);
            if (results.length >= MAX_LIMIT) break;
          }
          return results;
        };

        if (attackMode === 'combination') {
          let chars = '';
          if (comboCharSets.numbers) chars += '0123456789';
          if (comboCharSets.lowercase) chars += 'abcdefghijklmnopqrstuvwxyz';
          if (comboCharSets.uppercase) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
          if (comboCharSets.symbols) chars += '!@#$%^&*';
          if (comboCustomChars) chars += comboCustomChars;
          if (!chars) chars = '0123456789';
          chars = Array.from(new Set(chars.split(''))).join('');
          const minL = Math.max(1, Math.min(comboMinLen, comboMaxLen));
          const maxL = Math.max(minL, Math.min(6, comboMaxLen));
          return generateCombinations(chars, minL, maxL);
        }

        if (attackMode === 'mask') {
          let chars = '0123456789';
          if (maskCharset === 'lowercase') chars = 'abcdefghijklmnopqrstuvwxyz';
          if (maskCharset === 'alphanumeric') chars = '0123456789abcdefghijklmnopqrstuvwxyz';
          const unknownLen = Math.max(0, maskLength - maskPrefix.length - maskSuffix.length);
          if (unknownLen === 0) {
            return [maskPrefix + maskSuffix];
          }
          return generateCombinations(chars, unknownLen, unknownLen, maskPrefix, maskSuffix);
        }

        if (attackMode === 'brute') {
          const chars = bruteNumbersOnly ? '0123456789' : '0123456789abcdefghijklmnopqrstuvwxyz';
          return generateCombinations(chars, 1, Math.min(5, bruteMaxLen));
        }

        return BUILT_IN_DICTIONARY;
      };

      const verifyCandidatePassword = async (candidate, fileObj) => {
        if (fileObj.isDemo) {

        if (window.pdfjsLib && fileObj.rawBytes) {
          try {
            const loadingTask = window.pdfjsLib.getDocument({
              data: fileObj.rawBytes.slice(),
              password: candidate
            });
            const doc = await loadingTask.promise;
            if (doc && doc.numPages > 0) {

            }
          } catch (err) {
            return false;
          }
        }
        return false;

      const startRecoveryAttack = async () => {
        if (!currentFile) {
          showToast('Please select or upload a locked PDF file first', 'error');

        if (attackMode === 'direct' && !directPassword.trim()) {
          showToast('Please enter the known password to unlock', 'error');

        const candidates = buildCandidateList();
        if (candidates.length === 0) {
          showToast('No password candidates configured for this mode', 'error');
          return;

        setTotalCandidates(candidates.length);
        setTestedCount(0);
        setCurrentCandidate('');
        setRecentLogs([]);
        setRecoveredPassword('');
        setAttackErrorMsg('');
        setAttackStatus('running');
        attackControlRef.current.state = 'running';

        const startTime = performance.now();
        const isRealPdf = !currentFile.isDemo && window.pdfjsLib && currentFile.rawBytes;
        const batchSize = isRealPdf ? 4 : Math.max(8, Math.min(75, Math.ceil(candidates.length / 60)));

        for (let i = 0; i < candidates.length; i += batchSize) {
          if (attackControlRef.current.state === 'idle') {
            return;
          }

          while (attackControlRef.current.state === 'paused') {
            await new Promise((r) => setTimeout(r, 150));
            if (attackControlRef.current.state === 'idle') return;
          }

          const slice = candidates.slice(i, i + batchSize);
          let matchedPwd = null;

          for (let j = 0; j < slice.length; j++) {
            const candidate = slice[j];
            const isMatch = await verifyCandidatePassword(candidate, currentFile);
            if (isMatch) {
              matchedPwd = candidate;
              setTestedCount(i + j + 1);
              setCurrentCandidate(candidate);
              break;
            }
          }

          const currentTotalTested = matchedPwd
            ? i + slice.indexOf(matchedPwd) + 1
            : Math.min(i + batchSize, candidates.length);
          const elapsedSec = Math.max(0.1, (performance.now() - startTime) / 1000);
          const speed = Math.round(currentTotalTested / elapsedSec);

          const latestCand = matchedPwd || slice[slice.length - 1];
          setTestedCount(currentTotalTested);
          setCurrentCandidate(latestCand);
          setRecentLogs((prev) => [
            `[${currentTotalTested}/${candidates.length}] Testing hash key "${latestCand}" ... ${matchedPwd ? 'MATCH VALIDATED' : 'REJECTED'}`,
            ...prev.slice(0, 4)
          ]);
          setElapsedSeconds(elapsedSec);
          setAttackSpeed(speed);

          if (matchedPwd) {
            attackControlRef.current.state = 'success';
            setRecoveredPassword(matchedPwd);
            setAttackStatus('success');

            const modeLabels = {
              dictionary: 'Dictionary Attack',
              combination: 'Combination Attack',
              mask: 'Mask Attack',
              brute: 'Brute-Force Attack',
              direct: 'Direct Password Unlock'
            };
            setHistoryItems((prev) => [
              {
                id: 'hist-' + Date.now(),
                fileName: currentFile.name,
                mode: modeLabels[attackMode] || 'Password Recovery',
                recoveredPassword: matchedPwd,
                timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                fileSize: formatBytes(currentFile.size),
                status: 'Unlocked'
              },
              ...prev
            ]);
            showToast(`Password Found: "${matchedPwd}"!`, 'success');
            return;
          }

          await new Promise((r) => setTimeout(r, isRealPdf ? 15 : 28));
        }

        attackControlRef.current.state = 'failed';
        setAttackStatus('failed');
        setAttackErrorMsg(
          currentFile.isDemo
            ? `Password not found in current range. Tip: For "${currentFile.name}", try ${currentFile.hint}`

      const togglePauseAttack = () => {

        setTimeout(() => setCopiedPassword(false), 2000);

        if (attackMode === 'dictionary') {

          const unknown = Math.max(0, maskLength - maskPrefix.length - maskSuffix.length);

          let total = 0;
          for (let l = 1; l <= bruteMaxLen; l++) total += Math.pow(base, l);
          return Math.min(20000, total);
        }
        return 1;
      }, [

        customDictWords,
        comboCharSets,
        comboCustomChars,
        comboMinLen,
        comboMaxLen,
        maskLength,
        maskPrefix,
        maskSuffix,
        maskCharset,
        bruteMaxLen,

      ]);

            }`}
          >

                          <button
                            onClick={() => handleDownloadUnlockedPdf(currentFile)}
                            className="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs shadow-lg shadow-emerald-600/25 flex items-center gap-2 shrink-0"
                          >
                            <Download className="w-4 h-4" /> Download Unrestricted PDF
                          </button>
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              )}

              {/* ================================================================
                  TAB 4: SESSION RECOVERY HISTORY
              ================================================================ */}
              {activeTab === 'history' && (
                <div className="space-y-6">
                  <div className="flex items-center justify-between">
                    <div>
                      <h2 className="text-xl sm:text-2xl font-bold flex items-center gap-2.5">
                        <History className="w-6 h-6 text-indigo-400" /> Recovery & Unlock History
                      </h2>
                      <p className="text-xs sm:text-sm text-slate-400 mt-0.5">
                        View passwords recovered and PDFs unrestricted during your session.
                      </p>
                    </div>
                    {historyItems.length > 0 && (
                      <button
                        onClick={() => {
                          setHistoryItems([]);
                          showToast('Session history cleared', 'info');
                        }}
                        className="px-3 py-1.5 rounded-xl border border-slate-700 hover:bg-slate-800 text-xs text-slate-400 hover:text-rose-400 transition"
                      >
                        Clear History
                      </button>
                    )}
                  </div>

                  {historyItems.length === 0 ? (
                    <div
                      className={`p-12 rounded-2xl border text-center ${
                        darkMode ? 'bg-slate-900/50 border-slate-800' : 'bg-white border-slate-200'
                      }`}
                    >
                      <History className="w-10 h-10 text-slate-500 mx-auto mb-3" />
                      <h4 className="font-bold text-base">No Recovery History Yet</h4>
                      <p className="text-xs text-slate-400 mt-1">
                        Unlocked PDF files and recovered passwords will appear here for easy copying.
                      </p>
                    </div>
                  ) : (
                    <div className="space-y-3">
                      {historyItems.map((item) => (
                        <div
                          key={item.id}
                          className={`p-4 rounded-2xl border flex flex-col sm:flex-row sm:items-center justify-between gap-4 ${
                            darkMode ? 'bg-slate-900/80 border-slate-800' : 'bg-white border-slate-200'
                          }`}
                        >
                          <div className="flex items-center gap-3.5">
                            <div className="w-10 h-10 rounded-xl bg-emerald-500/15 border border-emerald-500/30 flex items-center justify-center text-emerald-400 shrink-0">
                              <Unlock className="w-5 h-5" />
                            </div>
                            <div>
                              <div className="flex items-center gap-2">
                                <span className="font-bold text-sm">{item.fileName}</span>
                                <span className="text-[10px] px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 font-semibold">
                                  {item.status}
                                </span>
                              </div>
                              <div className="text-xs text-slate-400 mt-0.5">
                                {item.mode} • {item.fileSize} • {item.timestamp}
                              </div>
                            </div>
                          </div>

                          <div className="flex items-center gap-3 self-end sm:self-center">
                            <div className="px-3 py-1.5 rounded-xl bg-slate-950 border border-slate-800 font-mono text-xs text-emerald-400">
                              {item.recoveredPassword}
                            </div>
                            <button
                              onClick={() => copyToClipboard(item.recoveredPassword)}
                              className="p-2 rounded-xl border border-slate-700 hover:bg-slate-800 text-slate-300"
                              title="Copy"
                            >
                              <Copy className="w-4 h-4" />
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              )}
            </div>
          </main>

          {/* ====================================================================
              MOBILE BOTTOM NAVIGATION BAR
          ==================================================================== */}
          <nav
            className={`md:hidden fixed bottom-0 left-0 right-0 z-40 border-t backdrop-blur-lg grid grid-cols-4 px-2 py-1.5 ${
              darkMode ? 'bg-slate-900/95 border-slate-800' : 'bg-white/95 border-slate-200'
            }`}
          >
            {[
              { id: 'home', label: 'Home', icon: Home },
              { id: 'recover', label: 'Recover PW', icon: Key },
              { id: 'restrict', label: 'Unrestrict', icon: Unlock },
              { id: 'history', label: 'History', icon: History }
            ].map((tab) => {
              const Icon = tab.icon;
              const active = activeTab === tab.id;
              return (
                <button
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  className={`flex flex-col items-center justify-center py-1.5 rounded-xl transition ${
                    active ? 'text-indigo-400 font-semibold' : 'text-slate-400'
                  }`}
                >
                  <Icon className="w-5 h-5 mb-0.5" />
                  <span className="text-[10px]">{tab.label}</span>
                </button>
              );
            })}
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
