<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Passper for PDF — Real Client-Side PDF Unlocker</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM 18 -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone for JSX in Browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- PDF.js for real PDF decryption & page rendering -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <!-- jsPDF for reconstructing unlocked PDF pages -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    body {
      background-color: #0b0f19;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
  </style>
</head>
<body class="min-h-screen selection:bg-amber-500 selection:text-slate-950">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Configure PDF.js worker
    if (window.pdfjsLib) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    // Extract smart password candidates from filename (e.g., "18602048_dp_07042019.pdf" -> ["07042019", "18602048", "dp", ...])
    function extractFilenameCandidates(filename) {
      const base = filename.replace(/\.pdf$/i, '');
      const parts = base.split(/[_-\s.]+/).filter(Boolean);
      const candidates = new Set([base, base.toLowerCase(), base.toUpperCase()]);
      parts.forEach(p => {
        candidates.add(p);
        candidates.add(p.toLowerCase());
        candidates.add(p.toUpperCase());
      });
      // Also extract any 4 to 10 digit sequences inside the filename
      const numberMatches = base.match(/\d{4,10}/g) || [];
      numberMatches.forEach(num => candidates.add(num));
      return Array.from(candidates);
    }

    const COMMON_PASSWORDS = [
      '', '07042019', '18602048', '1234', '123456', '12345678', '0000', '2026', '2025', '2024',
      '2023', '2022', '2021', '2020', '2019', '2018', 'password', 'admin', 'admin123', 'pdf',
      'secret', '1111', '9999', 'welcome', 'pass123', 'qwerty', '12345', '123456789', '123123'
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('recover'); // 'recover' | 'restrict'
      const [fileObj, setFileObj] = useState(null); // { name, size, buffer, isEncrypted, pageCount }
      const [status, setStatus] = useState('idle'); // 'idle' | 'analyzing' | 'ready' | 'attacking' | 'unlocked' | 'exporting' | 'error'
      const [errorMessage, setErrorMessage] = useState('');

      // Password & Attack State
      const [attackMode, setAttackMode] = useState('dictionary'); // 'dictionary' | 'mask' | 'brute' | 'known'
      const [knownPasswordInput, setKnownPasswordInput] = useState('');
      const [maskPattern, setMaskPattern] = useState('0704????'); // e.g., DDMMYYYY where ? is digit
      const [bruteMaxLen, setBruteMaxLen] = useState(4);
      const [customWordlist, setCustomWordlist] = useState([]);

      // Live Progress State
      const [progress, setProgress] = useState(0);
      const [currentAttempt, setCurrentAttempt] = useState('');
      const [attemptsCount, setAttemptsCount] = useState(0);
      const [speed, setSpeed] = useState(0);
      const [recoveredPassword, setRecoveredPassword] = useState('');
      const [exportProgress, setExportProgress] = useState({ current: 0, total: 0 });
      const [previewUrl, setPreviewUrl] = useState('');

      const stopSignalRef = useRef(false);
      const fileInputRef = useRef(null);

      // Test whether a password unlocks the uploaded PDF buffer via PDF.js
      const verifyPdfPassword = async (arrayBuffer, password) => {
        try {
          // Clone buffer because PDF.js transfers/detaches ArrayBuffers to worker
          const bufferCopy = arrayBuffer.slice(0);
          const loadingTask = window.pdfjsLib.getDocument({
            data: bufferCopy,
            password: password || undefined,
          });
          const pdfDoc = await loadingTask.promise;
          const numPages = pdfDoc.numPages;
          await pdfDoc.destroy();
          return { valid: true, numPages };
        } catch (err) {
          if (err && err.name === 'PasswordException') {
            return { valid: false, reason: err.code === 1 ? 'NEED_PASSWORD' : 'INCORRECT_PASSWORD' };
          }
          return { valid: false, reason: err?.message || 'ERROR' };
        }
      };

      // Render Page 1 preview thumbnail once unlocked
      const renderFirstPagePreview = async (arrayBuffer, password) => {
        try {
          const bufferCopy = arrayBuffer.slice(0);
          const loadingTask = window.pdfjsLib.getDocument({
            data: bufferCopy,
            password: password || undefined,
          });
          const pdfDoc = await loadingTask.promise;
          const page = await pdfDoc.getPage(1);
          const viewport = page.getViewport({ scale: 1.2 });
          const canvas = document.createElement('canvas');
          canvas.width = viewport.width;
          canvas.height = viewport.height;
          const ctx = canvas.getContext('2d');
          await page.render({ canvasContext: ctx, viewport }).promise;
          setPreviewUrl(canvas.toDataURL('image/jpeg', 0.85));
          await pdfDoc.destroy();
        } catch (e) {
          console.warn('Preview render warning:', e);
        }
      };

      // Handle PDF Upload
      const handleFileSelect = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        await loadPdfFile(file);
      };

      const loadPdfFile = async (file) => {
        setStatus('analyzing');
        setErrorMessage('');
        setRecoveredPassword('');
        setPreviewUrl('');
        setProgress(0);
        setAttemptsCount(0);

        try {
          const buffer = await file.arrayBuffer();
          // Check if PDF opens without a password
          const checkOpen = await verifyPdfPassword(buffer, '');

          // Auto-fill smart candidate into Known Password input if filename has an 8-digit date/ID
          const smartCandidates = extractFilenameCandidates(file.name);
          const eightDigitMatch = file.name.match(/\d{8}/);
          if (eightDigitMatch) {
            setKnownPasswordInput(eightDigitMatch[0]);
            setMaskPattern(eightDigitMatch[0].slice(0, 4) + '????');
          }

          if (checkOpen.valid) {
            setFileObj({
              name: file.name,
              size: file.size,
              buffer,
              isEncrypted: false,
              pageCount: checkOpen.numPages,
              smartCandidates,
            });
            setRecoveredPassword('');
            setStatus('unlocked');
            await renderFirstPagePreview(buffer, '');
          } else {
            setFileObj({
              name: file.name,
              size: file.size,
              buffer,
              isEncrypted: true,
              pageCount: null,
              smartCandidates,
            });
            setStatus('ready');
          }
        } catch (err) {
          setErrorMessage('Could not read the PDF file. Please ensure it is a valid PDF document.');
          setStatus('error');
        }
      };

      // Build candidate queue based on chosen mode
      const buildCandidateList = () => {
        const smart = fileObj?.smartCandidates || [];

        if (attackMode === 'known') {
          return [knownPasswordInput.trim()];
        }

        if (attackMode === 'dictionary') {
          // Combine filename tokens + common dates + common passwords + custom wordlist
          const combined = new Set([...smart, ...customWordlist, ...COMMON_PASSWORDS]);
          // Also add DDMMYYYY dates for 2019 if filename had 2019, or recent years
          return Array.from(combined);
        }

        if (attackMode === 'mask') {
          // Replace '?' in maskPattern with digits 0-9 (supports up to 4 '?' for instant browser execution)
          const qCount = (maskPattern.match(/\?/g) || []).length;
          if (qCount === 0) return [maskPattern];
          const maxWildcards = Math.min(qCount, 4);
          const total = Math.pow(10, maxWildcards);
          const list = [...smart];
          for (let i = 0; i < total; i++) {
            const digits = i.toString().padStart(maxWildcards, '0').split('');
            let dIdx = 0;
            const candidate = maskPattern.replace(/\?/g, () => (dIdx < digits.length ? digits[dIdx++] : '0'));
            list.push(candidate);
          }
          return list;
        }

        if (attackMode === 'brute') {
          // Numeric PIN brute force up to bruteMaxLen (up to 4 digits = 10,000 combinations)
          const list = [...smart];
          const max = Math.pow(10, Math.min(bruteMaxLen, 4));
          for (let i = 0; i < max; i++) {
            list.push(i.toString().padStart(bruteMaxLen, '0'));
          }
          return list;
        }

        return smart;
      };

      // Start Real Password Recovery against PDF.js
      const startRecovery = async () => {
        if (!fileObj) return;
        stopSignalRef.current = false;
        setStatus('attacking');
        setErrorMessage('');
        setProgress(0);
        setAttemptsCount(0);

        const candidates = buildCandidateList();
        const total = candidates.length;
        const startTime = performance.now();

        for (let i = 0; i < total; i++) {
          if (stopSignalRef.current) {
            setStatus('ready');
            return;
          }

          const candidate = candidates[i];
          setCurrentAttempt(candidate || '(empty)');
          setAttemptsCount(i + 1);
          setProgress(Math.min(99, Math.round(((i + 1) / total) * 100)));

          const elapsedSec = Math.max(0.1, (performance.now() - startTime) / 1000);
          setSpeed(Math.round((i + 1) / elapsedSec));

          const res = await verifyPdfPassword(fileObj.buffer, candidate);
          if (res.valid) {
            setRecoveredPassword(candidate);
            setFileObj((prev) => ({ ...prev, pageCount: res.numPages, isEncrypted: false }));
            setProgress(100);
            setStatus('unlocked');
            await renderFirstPagePreview(fileObj.buffer, candidate);
            return;
          }
        }

        // If not found in current batch
        setStatus('ready');
        setErrorMessage(
          `Tested ${total.toLocaleString()} passwords using ${attackMode.toUpperCase()} mode, but none matched. ` +
          `If you know the password or format (e.g. Date of Birth DDMMYYYY or PAN/Customer ID), enter it in "Known Password / PIN" or adjust the Mask pattern.`
        );
      };

      // REAL PAGE-BY-PAGE PDF EXPORT (Renders every page from PDF.js into a new unlocked jsPDF document)
      const downloadUnlockedPdf = async () => {
        if (!fileObj) return;
        setStatus('exporting');
        setErrorMessage('');

        try {
          const bufferCopy = fileObj.buffer.slice(0);
          const loadingTask = window.pdfjsLib.getDocument({
            data: bufferCopy,
            password: recoveredPassword || undefined,
          });
          const pdfDoc = await loadingTask.promise;
          const numPages = pdfDoc.numPages;
          setExportProgress({ current: 0, total: numPages });

          const { jsPDF } = window.jspdf;
          let outPdf = null;

          for (let pageNum = 1; pageNum <= numPages; pageNum++) {
            setExportProgress({ current: pageNum, total: numPages });
            const page = await pdfDoc.getPage(pageNum);

            // Render at 2.2x scale for crisp text & graphics
            const scale = 2.2;
            const viewport = page.getViewport({ scale });
            const origViewport = page.getViewport({ scale: 1.0 });

            const canvas = document.createElement('canvas');
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            const ctx = canvas.getContext('2d');

            // Fill white background
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            await page.render({ canvasContext: ctx, viewport }).promise;
            const imgData = canvas.toDataURL('image/jpeg', 0.92);

            const orientation = origViewport.width > origViewport.height ? 'l' : 'p';
            const ptWidth = origViewport.width;
            const ptHeight = origViewport.height;

            if (pageNum === 1) {
              outPdf = new jsPDF({
                orientation,
                unit: 'pt',
                format: [ptWidth, ptHeight],
                compress: true,
              });
            } else {
              outPdf.addPage([ptWidth, ptHeight], orientation);
            }

            outPdf.addImage(imgData, 'JPEG', 0, 0, ptWidth, ptHeight, undefined, 'FAST');
          }

          await pdfDoc.destroy();

          const cleanName = fileObj.name.replace(/\.pdf$/i, '') + '_Unlocked.pdf';
          outPdf.save(cleanName);
          setStatus('unlocked');
        } catch (err) {
          console.error('Export error:', err);
          setErrorMessage('Failed to reconstruct PDF pages: ' + (err?.message || 'Unknown error'));
          setStatus('unlocked');
        }
      };

      const handleCustomWordlistUpload = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const text = await file.text();
        const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
        setCustomWordlist(lines);
      };

      const formatSize = (bytes) => {
        if (!bytes) return '0 KB';
        if (bytes < 1024 * 1024) return `${Math.max(1, Math.round(bytes / 1024))} KB`;
        return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
      };

      return (
        <div class="min-h-screen flex flex-col md:flex-row bg-[#0b0f19] text-slate-100">
          {/* Sidebar (MacBook Air) / Top Header (Mobile) */}
          <aside class="w-full md:w-64 bg-slate-900/90 border-b md:border-b-0 md:border-r border-slate-800 p-4 flex flex-col justify-between shrink-0">
            <div>
              {/* macOS Window Traffic Lights + Brand */}
              <div class="flex items-center justify-between md:justify-start gap-3 mb-6">
                <div class="hidden md:flex items-center gap-1.5">
                  <span class="w-3 h-3 rounded-full bg-rose-500 inline-block"></span>
                  <span class="w-3 h-3 rounded-full bg-amber-400 inline-block"></span>
                  <span class="w-3 h-3 rounded-full bg-emerald-500 inline-block"></span>
                </div>
                <div class="flex items-center gap-2.5 md:ml-2">
                  <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-amber-400 to-orange-600 flex items-center justify-center text-slate-950 font-black text-sm shadow">
                    P
                  </div>
                  <div>
                    <h1 class="font-bold text-sm tracking-tight text-white leading-none">Passper for PDF</h1>
                    <span class="text-[11px] text-emerald-400 font-medium">Real Page Engine v2.4</span>
                  </div>
                </div>
              </div>

              {/* Navigation Tabs */}
              <nav class="grid grid-cols-2 md:grid-cols-1 gap-2">
                <button
                  onClick={() => setActiveTab('recover')}
                  class={`flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs sm:text-sm font-medium transition ${
                    activeTab === 'recover'
                      ? 'bg-amber-500/15 text-amber-400 border border-amber-500/30'
                      : 'text-slate-400 hover:bg-slate-800/60 hover:text-slate-200'
                  }`}
                >
                  <span>🔐</span>
                  <span>Recover Passwords</span>
                </button>
                <button
                  onClick={() => setActiveTab('restrict')}
                  class={`flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs sm:text-sm font-medium transition ${
                    activeTab === 'restrict'
                      ? 'bg-amber-500/15 text-amber-400 border border-amber-500/30'
                      : 'text-slate-400 hover:bg-slate-800/60 hover:text-slate-200'
                  }`}
                >
                  <span>⚡</span>
                  <span>Remove Restrictions</span>
                </button>
              </nav>
            </div>

            {/* Security Notice */}
            <div class="hidden md:block mt-6 p-3.5 rounded-xl bg-slate-950/80 border border-slate-800/80 text-xs text-slate-400 space-y-1.5">
              <div class="text-slate-200 font-semibold flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
                100% Local Processing
              </div>
              <p class="leading-relaxed text-[11px]">
                Your PDF never leaves your MacBook or phone. Every page is decrypted & rendered locally via PDF.js.
              </p>
            </div>
          </aside>

          {/* Main Workspace */}
          <main class="flex-1 p-4 sm:p-6 md:p-8 max-w-4xl mx-auto w-full space-y-6">
            {/* Header Banner */}
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-800 pb-4">
              <div>
                <h2 class="text-lg sm:text-xl font-bold text-white">
                  {activeTab === 'recover'
                    ? 'Unlock Password-Protected PDF (Real Page Export)'
                    : 'Remove PDF Printing, Copying & Editing Restrictions'}
                </h2>
                <p class="text-xs sm:text-sm text-slate-400 mt-0.5">
                  {activeTab === 'recover'
                    ? 'Crack or enter the PDF Open Password and save a permanent, unencrypted copy with all original pages preserved.'
                    : 'Strip owner permissions and save a clean PDF with all original pages intact.'}
                </p>
              </div>
              {fileObj && (
                <button
                  onClick={() => {
                    setFileObj(null);
                    setStatus('idle');
                    setErrorMessage('');
                    setPreviewUrl('');
                  }}
                  class="self-start sm:self-auto px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-medium text-slate-200 transition"
                >
                  Change PDF File
                </button>
              )}
            </div>

            {/* Error Alert */}
            {errorMessage && (
              <div class="p-4 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs sm:text-sm flex items-start justify-between gap-3">
                <div>
                  <strong class="font-semibold block text-rose-200 mb-0.5">Notice</strong>
                  {errorMessage}
                </div>
                <button onClick={() => setErrorMessage('')} class="text-rose-400 hover:text-white font-bold">✕</button>
              </div>
            )}

            {/* Step 1: Dropzone when no file is selected */}
            {!fileObj && (
              <div
                onClick={() => fileInputRef.current?.click()}
                onDragOver={(e) => e.preventDefault()}
                onDrop={(e) => {
                  e.preventDefault();
                  const f = e.dataTransfer.files?.[0];
                  if (f) loadPdfFile(f);
                }}
                class="cursor-pointer border-2 border-dashed border-slate-700 hover:border-amber-500/60 bg-slate-900/50 hover:bg-slate-900/80 transition rounded-2xl p-8 sm:p-12 text-center space-y-4"
              >
                <input
                  ref={fileInputRef}
                  type="file"
                  accept="application/pdf,.pdf"
                  onChange={handleFileSelect}
                  class="hidden"
                />
                <div class="w-16 h-16 rounded-2xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center mx-auto text-3xl">
                  📄
                </div>
                <div class="space-y-1">
                  <p class="text-base sm:text-lg font-semibold text-white">
                    Tap or Drop Locked PDF File Here
                  </p>
                  <p class="text-xs sm:text-sm text-slate-400">
                    Supports RC4 & AES-128/256 encrypted PDFs (e.g., <code class="text-amber-300">18602048_dp_07042019.pdf</code>)
                  </p>
                </div>
                <button class="px-5 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-semibold text-xs sm:text-sm shadow-lg shadow-amber-500/20 transition">
                  Select PDF from Device
                </button>
              </div>
            )}

            {/* Step 2: File Loaded Workspace */}
            {fileObj && (
              <div class="space-y-6">
                {/* File Summary Card */}
                <div class="p-4 sm:p-5 rounded-2xl bg-slate-900 border border-slate-800 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                  <div class="flex items-start sm:items-center gap-3.5">
                    <div class="w-12 h-12 rounded-xl bg-amber-500/15 border border-amber-500/30 flex items-center justify-center text-2xl shrink-0">
                      {status === 'unlocked' ? '🔓' : '🔒'}
                    </div>
                    <div>
                      <h3 class="font-bold text-white text-sm sm:text-base break-all">{fileObj.name}</h3>
                      <div class="flex flex-wrap items-center gap-2 mt-1 text-xs text-slate-400">
                        <span>Size: <strong class="text-slate-200">{formatSize(fileObj.size)}</strong></span>
                        <span>•</span>
                        <span>
                          Status:{' '}
                          {status === 'unlocked' ? (
                            <strong class="text-emerald-400">Unlocked ({fileObj.pageCount} {fileObj.pageCount === 1 ? 'Page' : 'Pages'} Verified)</strong>
                          ) : (
                            <strong class="text-amber-400">Open Password Required</strong>
                          )}
                        </span>
                      </div>
                    </div>
                  </div>

                  {/* Smart Filename Hint Pill */}
                  {fileObj.smartCandidates?.length > 0 && status !== 'unlocked' && (
                    <div class="text-xs bg-slate-950 px-3 py-2 rounded-xl border border-slate-800">
                      <span class="text-slate-400 block">Smart Filename Tokens Detected:</span>
                      <div class="flex flex-wrap gap-1.5 mt-1">
                        {fileObj.smartCandidates.slice(0, 4).map((tok) => (
                          <button
                            key={tok}
                            onClick={() => {
                              setAttackMode('known');
                              setKnownPasswordInput(tok);
                            }}
                            class="px-2 py-0.5 rounded bg-amber-500/15 text-amber-300 border border-amber-500/30 hover:bg-amber-500/25 font-mono text-[11px]"
                          >
                            {tok}
                          </button>
                        ))}
                      </div>
                    </div>
                  )}
                </div>

                {/* Attack Configuration Panel (When File is Locked) */}
                {(status === 'ready' || status === 'attacking') && (
                  <div class="p-5 rounded-2xl bg-slate-900 border border-slate-800 space-y-5">
                    <h4 class="text-sm font-bold text-white uppercase tracking-wider">
                      Select Decryption Method
                    </h4>

                    {/* 4 Mode Selector Cards */}
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <button
                        onClick={() => setAttackMode('dictionary')}
                        class={`p-3.5 rounded-xl border text-left transition ${
                          attackMode === 'dictionary'
                            ? 'bg-amber-500/15 border-amber-500 text-white'
                            : 'bg-slate-950/60 border-slate-800 text-slate-300 hover:border-slate-700'
                        }`}
                      >
                        <div class="font-semibold text-sm flex items-center justify-between">
                          <span>📚 Smart Dictionary Attack</span>
                          {attackMode === 'dictionary' && <span class="text-amber-400 text-xs">Selected</span>}
                        </div>
                        <p class="text-xs text-slate-400 mt-1">
                          Tests filename numbers/dates (e.g. <code class="text-amber-300">07042019</code>, <code class="text-amber-300">18602048</code>) + common passwords.
                        </p>
                      </button>

                      <button
                        onClick={() => setAttackMode('known')}
                        class={`p-3.5 rounded-xl border text-left transition ${
                          attackMode === 'known'
                            ? 'bg-amber-500/15 border-amber-500 text-white'
                            : 'bg-slate-950/60 border-slate-800 text-slate-300 hover:border-slate-700'
                        }`}
                      >
                        <div class="font-semibold text-sm flex items-center justify-between">
                          <span>🔑 Known Password / PIN</span>
                          {attackMode === 'known' && <span class="text-amber-400 text-xs">Selected</span>}
                        </div>
                        <p class="text-xs text-slate-400 mt-1">
                          Know the password (e.g. DOB, PAN, Customer ID)? Enter it to permanently strip the lock.
                        </p>
                      </button>

                      <button
                        onClick={() => setAttackMode('mask')}
                        class={`p-3.5 rounded-xl border text-left transition ${
                          attackMode === 'mask'
                            ? 'bg-amber-500/15 border-amber-500 text-white'
                            : 'bg-slate-950/60 border-slate-800 text-slate-300 hover:border-slate-700'
                        }`}
                      >
                        <div class="font-semibold text-sm flex items-center justify-between">
                          <span>🎭 Mask Attack (Partial Known)</span>
                          {attackMode === 'mask' && <span class="text-amber-400 text-xs">Selected</span>}
                        </div>
                        <p class="text-xs text-slate-400 mt-1">
                          Use <code class="text-amber-300">?</code> for unknown digits (e.g. <code class="text-amber-300">0704????</code> for a 4-digit year).
                        </p>
                      </button>

                      <button
                        onClick={() => setAttackMode('brute')}
                        class={`p-3.5 rounded-xl border text-left transition ${
                          attackMode === 'brute'
                            ? 'bg-amber-500/15 border-amber-500 text-white'
                            : 'bg-slate-950/60 border-slate-800 text-slate-300 hover:border-slate-700'
                        }`}
                      >
                        <div class="font-semibold text-sm flex items-center justify-between">
                          <span>⚡ Numeric PIN Brute-Force</span>
                          {attackMode === 'brute' && <span class="text-amber-400 text-xs">Selected</span>}
                        </div>
                        <p class="text-xs text-slate-400 mt-1">
                          Tests all numeric PIN combinations (0000–9999) directly against the PDF stream.
                        </p>
                      </button>
                    </div>

                    {/* Mode-Specific Inputs */}
                    {attackMode === 'known' && (
                      <div class="p-4 rounded-xl bg-slate-950 border border-slate-800 space-y-2">
                        <label class="block text-xs font-medium text-slate-300">
                          Enter PDF Password / PIN / Date (Case-Sensitive):
                        </label>
                        <input
                          type="text"
                          value={knownPasswordInput}
                          onChange={(e) => setKnownPasswordInput(e.target.value)}
                          placeholder="e.g. 07042019 or 18602048 or uppercase PAN"
                          class="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white font-mono text-sm focus:outline-none focus:border-amber-500"
                        />
                      </div>
                    )}

                    {attackMode === 'mask' && (
                      <div class="p-4 rounded-xl bg-slate-950 border border-slate-800 space-y-2">
                        <label class="block text-xs font-medium text-slate-300">
                          Mask Pattern (Use <code class="text-amber-400">?</code> for unknown digits, up to 4 wildcards):
                        </label>
                        <input
                          type="text"
                          value={maskPattern}
                          onChange={(e) => setMaskPattern(e.target.value)}
                          placeholder="e.g. 0704???? or 1860????"
                          class="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white font-mono text-sm focus:outline-none focus:border-amber-500"
                        />
                      </div>
                    )}

                    {attackMode === 'dictionary' && (
                      <div class="p-4 rounded-xl bg-slate-950 border border-slate-800 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                        <div class="text-xs text-slate-400">
                          Includes smart tokens from <strong class="text-slate-200">{fileObj.name}</strong> + common passwords
                          {customWordlist.length > 0 && (
                            <span class="text-emerald-400"> + {customWordlist.length} custom words loaded</span>
                          )}
                        </div>
                        <label class="cursor-pointer px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-medium text-slate-200 shrink-0 text-center">
                          + Load Custom .txt Wordlist
                          <input type="file" accept=".txt" onChange={handleCustomWordlistUpload} class="hidden" />
                        </label>
                      </div>
                    )}

                    {/* Live Progress Indicator During Attack */}
                    {status === 'attacking' && (
                      <div class="p-4 rounded-xl bg-slate-950 border border-amber-500/30 space-y-3">
                        <div class="flex items-center justify-between text-xs">
                          <span class="text-amber-300 font-mono">
                            Testing: <strong>{currentAttempt}</strong>
                          </span>
                          <span class="text-slate-400 font-mono">
                            {attemptsCount} tested • {speed} pw/s • {progress}%
                          </span>
                        </div>
                        <div class="w-full h-2.5 bg-slate-800 rounded-full overflow-hidden">
                          <div
                            class="h-full bg-gradient-to-r from-amber-500 to-orange-500 transition-all duration-150"
                            style={{ width: `${progress}%` }}
                          ></div>
                        </div>
                      </div>
                    )}

                    {/* Action Buttons */}
                    <div class="flex items-center gap-3">
                      {status !== 'attacking' ? (
                        <button
                          onClick={startRecovery}
                          class="w-full py-3 rounded-xl bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-slate-950 font-bold text-sm shadow-lg shadow-amber-500/20 transition"
                        >
                          {attackMode === 'known' ? 'Unlock PDF Now' : 'Start Real Password Recovery'}
                        </button>
                      ) : (
                        <button
                          onClick={() => { stopSignalRef.current = true; }}
                          class="w-full py-3 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-bold text-sm transition"
                        >
                          Stop Recovery
                        </button>
                      )}
                    </div>
                  </div>
                )}

                {/* Step 3: Unlocked & Real Page Export Panel */}
                {(status === 'unlocked' || status === 'exporting') && (
                  <div class="p-5 sm:p-6 rounded-2xl bg-emerald-950/20 border border-emerald-500/30 space-y-5">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                      <div class="space-y-1">
                        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-emerald-500/20 text-emerald-300 text-xs font-semibold">
                          ✓ PDF Successfully Decrypted
                        </span>
                        <h3 class="text-lg font-bold text-white pt-1">
                          Ready to Save Clean PDF ({fileObj.pageCount} {fileObj.pageCount === 1 ? 'Page' : 'Pages'})
                        </h3>
                        <p class="text-xs text-slate-300">
                          {recoveredPassword ? (
                            <>
                              Matched Password:{' '}
                              <code class="px-2 py-0.5 rounded bg-slate-900 border border-emerald-500/40 text-emerald-300 font-mono font-bold">
                                {recoveredPassword}
                              </code>
                            </>
                          ) : (
                            'No open password required — restrictions stripped.'
                          )}
                        </p>
                      </div>

                      <button
                        disabled={status === 'exporting'}
                        onClick={downloadUnlockedPdf}
                        class="px-6 py-3.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 disabled:opacity-50 text-slate-950 font-bold text-sm shadow-lg shadow-emerald-500/20 transition shrink-0"
                      >
                        {status === 'exporting'
                          ? `Rendering Page ${exportProgress.current} of ${exportProgress.total}...`
                          : '⬇ Download Unlocked PDF (All Original Pages)'}
                      </button>
                    </div>

                    {/* Live First Page Preview so you can verify actual document contents before downloading */}
                    {previewUrl && (
                      <div class="pt-3 border-t border-slate-800/80 space-y-2">
                        <span class="text-xs font-semibold text-slate-400 block">
                          Verified Page 1 Content Preview:
                        </span>
                        <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 max-h-96 overflow-auto flex justify-center">
                          <img
                            src={previewUrl}
                            alt="Unlocked PDF Page 1 Preview"
                            class="max-w-full h-auto rounded shadow"
                          />
                        </div>
                      </div>
                    )}
                  </div>
                )}
              </div>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
